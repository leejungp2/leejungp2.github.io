<div class="container visitor-counter" data-site-url="{{ site.url | escape }}" role="group" aria-label="Site page views" aria-live="polite" aria-atomic="true" title="Page views today (KST) / all time">
  <span>Today <span data-views-today>—</span></span>
  <span aria-hidden="true">/</span>
  <span>Total <span data-views-total>—</span></span>
</div>
