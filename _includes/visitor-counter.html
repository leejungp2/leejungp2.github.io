<div class="container visitor-counter" data-site-url="{{ site.url | escape }}" role="group" aria-label="Site visits" aria-live="polite" aria-atomic="true" title="Visits today (KST) / all time; counted once per browser per day">
  <span>Today <span data-views-today>—</span></span>
  <span aria-hidden="true">/</span>
  <span>Total <span data-views-total>—</span></span>
</div>
