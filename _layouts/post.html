---
layout: default
---

<article class="app-surface">
  <div class="page-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {%- if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif -%}
    </p>
  </div>

  {{ content }}

  <p style="margin-top:2rem"><a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a></p>
</article>
