---
layout: default
---

<article class="page-shell{% if page.surface %} app-surface{% endif %}">
  <div class="page-header">
    <div class="page-title-row">
      <h1>{{ page.title }}</h1>
      {%- if page.action_label and page.action_disabled -%}
        <span class="page-header-action is-disabled" aria-disabled="true">
          {{ page.action_label }}
        </span>
      {%- elsif page.action_label and page.action_url -%}
        <a class="page-header-action" href="{{ page.action_url | relative_url }}" download>
          {{ page.action_label }}
        </a>
      {%- endif -%}
    </div>
    {%- if page.description -%}
      <p>{{ page.description }}</p>
    {%- endif -%}
  </div>

  {{ content }}
</article>
