---
layout: default
---

<section class="about">
  <div class="about-copy">
    <h1>{{ page.heading | default: site.title }}</h1>
    {%- if page.subtitle -%}
      <p class="about-subtitle">{{ page.subtitle | replace: ' Researcher at ', ' Researcher<span class="mobile-subtitle-break"></span> at ' }}</p>
    {%- endif -%}

    <div class="bio">
      {{ content }}
    </div>
  </div>

  {%- if page.profile_image -%}
    <div class="about-media">
      <figure class="profile-frame">
        <img class="profile-pic" src="{{ page.profile_image | relative_url }}" alt="{{ site.author | default: site.title }}" />
      </figure>
      {%- include social-buttons.html -%}
    </div>
  {%- endif -%}
</section>
