# --- Site identity ---------------------------------------------------------
title: Jung Lee
tagline: Research Portfolio
description: >-
  Personal research portfolio of Jung Lee.
author: Jung Lee
email: leejungp2@snu.ac.kr

# User/org GitHub Pages site → served at the domain root.
url: "https://leejungp2.github.io"
baseurl: ""

lang: en
timezone: America/Chicago

# --- Build ------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

# `_pages/` is an underscore dir, so Jekyll ignores it unless we include it.
include:
  - _pages

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - DESIGN.md
  - references
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
