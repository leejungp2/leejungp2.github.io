- slug: what-can-i-control
  group: international
  title: "\"What Can I Control?\": Designing an Attribution Reframing Chatbot for Early-Career Employees' Workplace Stress Management"
  authors: [Jung Lee, Jaehoon Choi, Hyungwoo Song, Minjeong Shin, Bongwon Suh]
  venue: "Extended Abstracts of the 2026 CHI Conference on Human Factors in Computing Systems (CHI EA '26)"
  venue_short: CHI 2026
  type: Extended Abstract
  image: /assets/img/publications/what_can_i_control.webp
  image_alt: Attribution reframing chatbot conversation flow
  links:
    - label: PDF
      url: https://dl.acm.org/doi/pdf/10.1145/3772363.3798873
    - label: ACM DL
      url: https://dl.acm.org/doi/10.1145/3772363.3798873
  abstract: >-
    Early-career employees are particularly vulnerable to workplace stress due to psychosocial stressors such as high work demands and low job control.
    Despite the importance of addressing these stressors, existing digital interventions for early-career employees focus on information-oriented support like onboarding.
    This study presents an attribution reframing chatbot (AR chatbot) for workplace stress management among early-career employees.
    Attribution reframing offers a cognitive intervention point of psychosocial stressors by shifting how individuals interpret stress causes along locus and controllability dimensions.
    Following formative interviews with 11 early-career employees exploring stress situations and interpretation patterns,
    we evaluated the AR chatbot with 14 early-career employees across two common stress situations.
    In work-related situation, stress and controllability significantly improved alongside confidence and readiness,
    whereas in interpersonal situation, only confidence showed improvement.
    This study contributes to a deeper understanding of workplace stress among early-career employees
    and offers design implications for supporting early-career employees with the AR chatbot.
  bibtex: |-
