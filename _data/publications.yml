    }

- slug: legisflow
  group: international
  title: "LegisFlow: Enhancing Korean Legal Research with Temporal-Aware LLM Interfaces"
  authors: [Junghwan Kim*, Hyeonseok Jeon*, Dongseok Heo, Jung Lee, Bongwon Suh]
  venue: "Proceedings of the 38th Annual ACM Symposium on User Interface Software and Technology (UIST '25)"
  venue_short: UIST 2025
  type: Full Paper
  image: /assets/img/publications/legisflow.webp
  image_alt: LegisFlow interface with statute amendment timeline
  links:
    - label: PDF
      url: https://dl.acm.org/doi/pdf/10.1145/3746059.3747752
    - label: ACM DL
      url: https://dl.acm.org/doi/10.1145/3746059.3747752
  abstract: >-
    In South Korea's statutory law system, legal research faces challenges like tracking frequent amendments and understanding complex statute relationships.
    LegisFlow, an innovative AI-powered system, tackles these issues with features such as interactive amendment timelines and advanced inter-statute relationship analysis.
    Developed based on insights from Korean legal experts, it provides intuitive visualizations and context-aware search capabilities.
    A user study with 10 legal professionals demonstrated that LegisFlow significantly enhances efficiency,
    reducing task completion times by up to 36% (e.g., 440s vs. 690s in inter-statute comparison, p = 0.022)
    and lowering cognitive load, with workflows streamlined by 70% fewer manual steps.
    LegisFlow transforms statutory law research by setting a new standard for AI-assisted tools,
    providing a scalable, user-centered solution for professionals in Korea and beyond.
  bibtex: |-
    @inproceedings{kim2025legisflow,
      title     = {LegisFlow: Enhancing Korean Legal Research with Temporal-Aware LLM Interfaces},
