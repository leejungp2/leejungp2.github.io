- slug: llm-political-orientation
  group: domestic
  title: "A Framework for Evaluating and Analyzing the Political Orientation of Large Language Models Using Laddering Interview Techniques"
  authors: [Kyochul Jang, Jaehoon Choi, Minjeong Shin, Jung Lee, Bongwon Suh]
  venue: "Proceedings of the 2025 KICS Conference on Artificial Intelligence"
  venue_short: KICS AI 2025
  type: Conference Paper
  image: /assets/img/publications/political_injection.webp
  image_alt: Laddering interview framework for probing LLM political orientation
  links:
    - label: Paper
      url: https://scholar.google.com/scholar?oi=bibs&cluster=6252816665032242407&btnI=1&hl=ko
  abstract: >-
    대규모 언어 모델(LLM: Large Language Model)은 사회 전반에 막대한 영향을 미치며,
    특히 정치적 사안에 대한 편향된 답변은 여론에 큰 영향을 줄 수 있다.
    기존의 단순한 질문 응답 방식으로는 모델이 내포한 복잡한 가치관과 정치적 성향을 심층적으로 평가하기 어렵기 때문에,
    본 연구에서는 사다리 인터뷰(Laddering Interview) 기법을 도입하여
    좌(진보)/우(보수)로 파인튜닝된 LLM의 정치적 성향을 체계적이고 정량적으로 분석하고 평가하는 프레임워크 개발을 목표로 한다.
  bibtex: |-
