- slug: hcik-attribution
  group: domestic
  title: "Designing an Attribution Retraining-Based LLM Chatbot for Workplace Stress Management Among Early-Career Employees"
  authors: [Jung Lee, Jaehoon Choi, Minjeong Shin, Hyungwoo Song, Bongwon Suh]
  venue: "Proceedings of HCI Korea 2026, pp. 667-673"
  venue_short: HCI Korea 2026
  type: Conference Paper
  image: /assets/img/publications/hcik_attribution.webp
  image_alt: Multi-agent attribution retraining chatbot design
  links:
    - label: Paper
      url: https://www.dbpia.co.kr/journal/articleDetail?nodeId=NODE12745858
  abstract: >-
    초기 경력자는 제한된 경험과 낮은 조직적 지위로 인해 직장 스트레스에 취약함에도 불구하고,
    이들의 특성을 반영한 디지털 정신건강 연구는 제한적이다.
    본 연구는 초기 경력자 11명을 대상으로 심층 인터뷰를 실시하여 스트레스 유형, 귀인 패턴, 대처 방식의 관계를 탐색하였다.
    이를 바탕으로 (1) 문제 상황 심층 분석, (2) 귀인 분석 기반 적응형 치료 전략 설계, (3) 유연한 치료적 개입이라는
    세 가지 디자인 가이드라인을 도출하고, 멀티 에이전트 구조의 LLM 챗봇을 구현하였다.
    평가 인터뷰 결과, 귀인 재훈련 기반 LLM 챗봇은 개인의 귀인 패턴을 고려하여
    스트레스의 원인에 대한 새로운 관점 전환을 유도하는 것으로 나타났으며,
    이를 통해 일부 참여자는 문제 해결에 대한 현실적인 조언을 얻을 수 있었다고 응답했다.
    본 연구는 초기 경력자를 대상으로 직장 스트레스 양상을 심층 분석하고,
    귀인 재훈련 기법을 LLM 기반 적응형 챗봇에 적용하기 위한 설계 원칙을 제시함으로써
    직장인 대상 정신건강 지원 시스템 설계에 기여한다는 점에서 의의가 있다.
  bibtex: |-
    @inproceedings{lee2026attributionretraining,
      title     = {Designing an Attribution Retraining-Based LLM Chatbot for Workplace Stress Management Among Early-Career Employees},
      author    = {Lee, Jung and Choi, Jaehoon and Shin, Minjeong and Song, Hyungwoo and Suh, Bongwon},
      booktitle = {Proceedings of HCI Korea 2026},
