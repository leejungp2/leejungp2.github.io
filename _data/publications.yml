      title     = {CaseSense: Mapping the Legal Case Landscape with Multi-Dimensional Visual Exploration},
      author    = {Kim, Junghwan and Jeon, Hyeonseok and Lee, Jung and Heo, Dongseok and Suh, Bongwon},
      booktitle = {Proceedings of the 39th Annual ACM Symposium on User Interface Software and Technology},
      series    = {UIST '26},
      year      = {2026},
      pages     = {1--22},
      publisher = {Association for Computing Machinery},
      address   = {New York, NY, USA},
