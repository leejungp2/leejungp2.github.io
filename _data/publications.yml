      title     = {A Framework for Evaluating and Analyzing the Political Orientation of Large Language Models Using Laddering Interview Techniques},
      author    = {Jang, Kyochul and Choi, Jaehoon and Shin, Minjeong and Lee, Jung and Suh, Bongwon},
      booktitle = {Proceedings of the 2025 KICS Conference on Artificial Intelligence},
      year      = {2025},
      publisher = {Korean Institute of Communications and Information Sciences}
    }
