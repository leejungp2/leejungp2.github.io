- slug: just-listening
  group: international
  title: "\"Just Listening Was Enough—Until It Wasn't\": Relationship-Stage-Aware Cognitive Scaffolding in AI Companions"
  authors: [Minchae Kim, Hyungwoo Song, Jung Lee, Bongwon Suh]
  venue: "Extended Abstracts of the 2026 CHI Conference on Human Factors in Computing Systems (CHI EA '26)"
  venue_short: CHI 2026
  type: Extended Abstract
  image: /assets/img/publications/just_listening.webp
  image_alt: Validating and scaffolding AI companion conditions across relationship stages
  links:
    - label: Paper
      url: https://dl.acm.org/doi/10.1145/3772363.3798512
    - label: PDF
      url: https://dl.acm.org/doi/pdf/10.1145/3772363.3798512
  abstract: >-
    AI companions provide immediate emotional support, yet longitudinal studies reveal patterns of reduced real-world connection
    and reinforced cognitive distortions among prolonged users.
    To mitigate these risks beyond reactive restrictions while addressing users' core needs,
    we developed a 'Scaffolding Companion' that integrates cognitive reframing into peer-like interactions,
    comparing it with a 'Validating Companion' offering unconditional acceptance representative of current AI companions.
    We conducted a 2 × 2 within-subjects experiment with 16 experienced users,
    examining both systems across the Exploratory and Affective relationship stages grounded in Social Penetration Theory.
    Our mixed-methods analysis showed increasing preference for the Scaffolding Companion as relationships deepened without reducing perceived empathy,
    revealing a paradox where prolonged unconditional validation risked emotional stagnation despite initial relief.
    This work contributes preliminary insights into reconceptualizing cognitive reframing as an alternative form of comfort
    and suggests the potential importance of adaptive, stage-sensitive interaction design for AI companions.
  bibtex: |-
